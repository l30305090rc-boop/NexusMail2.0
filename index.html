<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma segura de indexación temporal de correo electrónico">
  <title>NexusMail 2.0 - Acceso</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="fondo"></div>

  <div class="login-box">
    <h1>🚀 NexusMail 2.0</h1>
    <p class="subtitulo">
      Plataforma segura de indexación temporal de correo electrónico - Beta 2.0
    </p>

    <input type="password" id="codigo" placeholder="🔑 Código de acceso" autocomplete="off">
    <button onclick="validarCodigo()">Ingresar al panel</button>
    <div id="mensaje"></div>
    
    <div class="info-codigo">
      <small>🔐 Código de acceso: <strong>NEXUS2026</strong></small>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
