<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusMail 2.0 Beta</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="bg"></div>

<main class="login-card">
    <div class="brand">NEXUSMAIL 2.0</div>

    <h1>Acceso Seguro Beta</h1>

    <p class="subtitle">
        Búsqueda simultánea en múltiples correos autorizados Gmail, Hotmail y Outlook.
    </p>

    <div class="notice">
        No solicitamos ni almacenamos contraseñas. Las cuentas se conectan mediante autorización segura.
    </div>

    <input id="accessCode" type="text" placeholder="Código de acceso" autocomplete="off">

    <label class="terms">
        <input id="terms" type="checkbox">
        <span>Acepto términos, condiciones y uso temporal de la plataforma.</span>
    </label>

    <button id="loginBtn" type="button">INGRESAR</button>

    <p class="small">
        Sesión protegida con cierre automático por inactividad.
    </p>
</main>

<script>
const CODIGO_VALIDO = "NEXUS2026";

const loginBtn = document.getElementById("loginBtn");
const accessCode = document.getElementById("accessCode");
const terms = document.getElementById("terms");

loginBtn.addEventListener("click", function() {
    const codigo = accessCode.value.trim();

    if (codigo === "") {
        alert("Ingrese su código de acceso.");
        return;
    }

    if (codigo !== CODIGO_VALIDO) {
        alert("Código de acceso incorrecto.");
        return;
    }

    if (!terms.checked) {
        alert("Debe aceptar los términos y condiciones.");
        return;
    }

    sessionStorage.setItem("nexus_auth", "true");

    loginBtn.innerText = "VERIFICANDO...";
    loginBtn.disabled = true;

    setTimeout(function() {
        window.location.href = "panel.html";
    }, 800);
});
</script>

</body>
</html>
