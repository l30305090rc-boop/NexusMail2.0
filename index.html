<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusMail 2.0 Beta</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>
<div class="glow glow-one"></div>
<div class="glow glow-two"></div>

<main class="card">

    <div class="badge">VERSIÓN 2.0 BETA</div>

    <h1>NexusMail</h1>

    <p class="subtitle">
        Plataforma segura de indexación temporal de correo electrónico
    </p>

    <div class="notice">
        No almacenamos contraseñas, archivos ni contenido confidencial después de cerrar la sesión.
    </div>

    <input type="text" placeholder="Ingrese su código de acceso">

    <label class="terms">
        <input type="checkbox">
        <span>Acepto los términos y condiciones de uso temporal.</span>
    </label>

    <button>INGRESAR A LA PLATAFORMA</button>

    <p class="footer">
        Acceso exclusivo para clientes autorizados.
    </p>

</main>

</body>
</html>
