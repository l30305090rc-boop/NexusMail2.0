<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel de control NexusMail 2.0">
  <title>NexusMail 2.0 - Panel</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="panel">
    <div class="header-panel">
      <h1>🚀 NexusMail 2.0</h1>
      <div id="temporizador" class="temporizador">⏱️ 5:00</div>
    </div>

    <div class="acciones">
      <button id="btnConectar" onclick="iniciarGoogleOAuth()">
        🔌 Conectar Gmail
      </button>
      <button onclick="cerrarSesion()">
        🚪 Cerrar sesión
      </button>
    </div>

    <div class="buscador">
      <input type="text" id="buscar" placeholder="📧 Buscar correos..." autocomplete="off">
      <button onclick="buscarCorreos()">🔍 Buscar</button>
    </div>

    <div id="estado" class="estado"></div>
    <div id="lista-cuentas"></div>
    <div id="resultados"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
